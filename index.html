<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Đọc Truyện</title>

    <link
        rel="stylesheet"
        href="./assets/style.css"
    >
</head>

<body>

<header class="site-header">

    <div class="header-inner">

        <a
            href="./"
            class="logo"
        >
            📚 Đọc Truyện
        </a>

        <div
            id="storyInfo"
            class="story-info"
        >
            Đang tải...
        </div>

    </div>

</header>


<main class="reader">

    <!-- PAGINATION TOP -->

    <nav class="pagination">

        <button
            id="prevButton"
            type="button"
        >
            ← Trang trước
        </button>

        <span id="pageInfo">
            Trang 1 / 1
        </span>

        <button
            id="nextButton"
            type="button"
        >
            Trang sau →
        </button>

    </nav>


    <!-- LOADING -->

    <div
        id="loading"
        class="loading"
    >
        Đang tải chương...
    </div>


    <!-- ERROR -->

    <div
        id="error"
        class="error hidden"
    >
    </div>


    <!-- CHAPTERS -->

    <section id="chapters">
    </section>


    <!-- PAGINATION BOTTOM -->

    <nav class="pagination">

        <button
            id="prevButtonBottom"
            type="button"
        >
            ← Trang trước
        </button>

        <span id="pageInfoBottom">
            Trang 1 / 1
        </span>

        <button
            id="nextButtonBottom"
            type="button"
        >
            Trang sau →
        </button>

    </nav>

</main>


<footer>

    © <span id="year"></span>
    Cuong Van Le Dev

</footer>


<script src="./assets/app.js"></script>

</body>

</html>
